name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        working-directory: app
        run: |
          pip install -e ".[dev]"
      - name: Generate fixtures
        working-directory: app
        run: python scripts/generate_fixtures.py
      - name: Generate scale fixtures
        working-directory: app
        run: python scripts/generate_scale_fixtures.py
      - name: Generate eval datasets
        working-directory: app
        run: python scripts/generate_eval_datasets.py
      - name: Unit tests
        working-directory: app
        run: pytest tests/ -v
      - name: Latency benchmark
        working-directory: app
        run: python evals/runners/run_latency_benchmark.py --output latency-report.json
        continue-on-error: true
      - name: Eval suite
        working-directory: app
        run: python evals/runners/run_eval_suite.py --output eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: app/eval-report.json
          retention-days: 30

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build UI
        working-directory: app/ui
        run: |
          npm install
          npm run build
