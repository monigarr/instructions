# Streamlit Community Cloud configuration (repo root).
# USWDS-aligned palette to match the React UI's federal-design posture.

[theme]
base = "light"
primaryColor = "#005ea2"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f0f0"
textColor = "#1b1b1b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
