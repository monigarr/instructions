[project]
name = "labelforge"
version = "0.1.0"
description = "TTB Alcohol Label Verification — LabelForge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.150.0",
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.12",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "httpx>=0.27.0",
    "langgraph>=1.2.16",
    "langchain-core>=1.6.12",
]

[project.optional-dependencies]
azure = ["azure-ai-documentintelligence>=1.0.0"]
rag = ["chromadb>=0.5.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's File()/Form() in argument defaults is the documented, required idiom.
"src/api/main.py" = ["B008"]
